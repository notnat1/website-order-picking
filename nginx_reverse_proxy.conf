# This is a template Nginx configuration for setting up a reverse proxy.
# You will need to place this file on your server, typically in a new file at:
# /etc/nginx/sites-available/inventory-app.natte.site

# After creating and editing the file, you need to enable it and restart Nginx:
# sudo ln -s /etc/nginx/sites-available/inventory-app.natte.site /etc/nginx/sites-enabled/
# sudo nginx -t  # Test configuration for errors
# sudo systemctl restart nginx

server {
    listen 80;
    server_name inventory-app.natte.site;

    # Optional: Redirect www to non-www
    if ($host = www.inventory-app.natte.site) {
        return 301 https://$host$request_uri;
    } 

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name inventory-app.natte.site;

    # SSL Certificate paths (replace with your actual paths from Certbot/Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/inventory-app.natte.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inventory-app.natte.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Main location for the frontend application
    location / {
        # The frontend container is now exposed on host port 8080.
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Location for the backend API calls
    location /api/ {
        # The backend container is exposed on host port 5001.
        proxy_pass http://localhost:5001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
