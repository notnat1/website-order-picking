version: '3.8'

services:
  backend:
    build:
      context: ./inventaris-backend # Path to your backend's Dockerfile
      dockerfile: Dockerfile
    container_name: inventaris_backend_app
    restart: always
    ports:
      - "5001:5001" # Expose backend port to host
    environment:
      # These variables can also be in .env. We explicitly set the DB host here.
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5001
    depends_on:
      - db # Backend depends on the database service
    networks:
      - inventory-net

  frontend:
    build:
      context: ./inventaris-frontend # Path to your frontend's Dockerfile
      dockerfile: Dockerfile
    container_name: inventaris_frontend_app
    restart: always
    environment:
      # This variable is used during the frontend build process
      VITE_API_BASE_URL: /api
    depends_on:
      - backend # Frontend depends on the backend service for API calls
    networks:
      - inventory-net

  db:
    image: mysql:8.0 # Use MySQL 8.0 image (or your preferred version)
    container_name: inventaris_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD} # Defined in root .env file
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306" # Optional: Expose DB port if you need to access it from host
    volumes:
      - db_data:/var/lib/mysql # Persistent data storage for the database
    networks:
      - inventory-net

volumes:
  db_data: {} # Defines the named volume for database persistence

networks:
  inventory-net:
    driver: bridge
