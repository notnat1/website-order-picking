server {
    listen 80;
    root /usr/share/nginx/html;

    # Redirect all HTTP traffic to HTTPS
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public";
    }
}